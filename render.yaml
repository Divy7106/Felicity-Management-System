services:
  - type: web
    name: felicity-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURITY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_EXPIRY
        value: 7d
      - key: JWT_ALGORITHM
        value: HS512
      - key: COOKIE_MAX_AGE
        value: "604800000"
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: ORGANIZER_EMAIL_DOMAIN
        value: "@felicity.local"
      # Set these manually in Render Dashboard → Environment
      - key: MONGO_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_APP_PASSWORD
        sync: false
      - key: SYSTEM_EMAIL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: BASE_URL
        sync: false